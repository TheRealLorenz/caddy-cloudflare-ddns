name: Create and publish a Container image

on:
  schedule:
    - cron: "0 4 * * 1"
  push:
    branches: [main]
    paths: [Containerfile, .github/workflows/**]
  pull_request:
    paths: [Containerfile, .github/workflows/**]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Resolve versions
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CADDY=$(gh api repos/caddyserver/caddy/releases/latest --jq .tag_name)
          CF=$(git ls-remote https://github.com/caddy-dns/cloudflare HEAD | cut -c1-12)
          DDNS=$(git ls-remote https://github.com/mholt/caddy-dynamicdns HEAD | cut -c1-12)
          HASH=$(echo "$CF-$DDNS" | sha256sum | cut -c1-8)
          echo "caddy=${CADDY#v}" >> "$GITHUB_OUTPUT"
          echo "cf=$CF" >> "$GITHUB_OUTPUT"
          echo "ddns=$DDNS" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Generate tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ver.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.ver.outputs.caddy }}
            type=raw,value=${{ steps.ver.outputs.caddy }}-${{ steps.ver.outputs.hash }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          file: ./Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CADDY_VERSION=${{ steps.ver.outputs.caddy }}
            CF_VERSION=${{ steps.ver.outputs.cf }}
            DDNS_VERSION=${{ steps.ver.outputs.ddns }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # This step generates an artifact attestation for the image, which is an unforgeable statement about where and how it was built. It increases supply chain security for people who consume the image. For more information, see [Using artifact attestations to establish provenance for builds](/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds).
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.ver.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true


